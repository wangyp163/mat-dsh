# mat-dsh M0 overlay：骑在 web profile 之上（--patch）
# LLM 路由模式复制自 vasp-matstream-dsh profiles/spike.yml（2026-08-24 已验证）：
#   自定义 baseURL + apiKeyEnv + compat.thinkingFormat: deepseek
# 注意：llm-pi-ai 行是"替换"（同 id 覆盖 dsh-base 默认行），插件行是 insert。
- id: llm-pi-ai
  config:
    providers:
      mat:
        displayName: HPC LLM
        apiKeyEnv: LLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL
        compat:
          thinkingFormat: deepseek
        # 路由级默认推理等级（adapter: options.reasoningEffort ?? profile.reasoning）
        reasoning: high
        # 双模型显式目录：名称可区分；上下文窗口 1M（插件默认仅 262144，须显式声明）。
        # reasoningEfforts 必须逐模型声明：本路由是 hand-declared（不在 pi-ai 内置目录），
        # 缺省时模型无 reasoning 能力 → resolveModelInfo 不含 reasoning 元数据，
        # /model 弹窗就没有推理等级可选（2026-08-28 用户实测反馈）。
        # 等级集对齐 deepseek 家族（llm-deepseek 插件枚举 off/low/high/max）；off 为空值=不发送。
        models:
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            contextWindow: 1000000
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            contextWindow: 1000000
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
      # BigModel GLM（glm-5.3-flash）：解决 HPC 网关 deepseek 双模型无图像输入
      # 的问题（2026-09-04 实测两模型对 image_url 均静默丢图）。密钥放 env.local
      # 的 BIGMODEL_API_KEY。思考等级依据官方文档（capabilities/thinking）：
      # GLM-5.3 系不可关闭思考（thinking.type:disabled 直接报错），深度用
      # reasoning_effort low/high/max 调节；zai 格式在"无等级"时发 disabled → 400，
      # 故不声明 off 档，并以路由级 reasoning: high 兜底保证请求必带等级；
      # open.bigmodel.cn 的 zai 检测默认 supportsReasoningEffort=false，必须显式
      # 打开才会发送 reasoning_effort（否则 thinking 只能开/关、深度恒为默认 max）。
      # glm-5.3-flash 是 GLM-5 系首个原生多模态（图片/视频/文件），input 声明
      # image 后 read_image 工具的路由闸即对其放行。
      bigmodel:
        displayName: BigModel GLM
        apiKeyEnv: BIGMODEL_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        compat:
          thinkingFormat: zai
          supportsReasoningEffort: true
        reasoning: high
        models:
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max

- id: agent-default-model
  config:
    # 路由随环境切换（mat=deepseek 双模型 | bigmodel=glm-5.3-flash 多模态），
    # 与 LLM_MODEL_ID 配套；用户级 settings.yaml 的 agent-default-model 同旨。
    provider: !!js process.env.LLM_PROVIDER_ID || 'mat'
    model: !!js process.env.LLM_MODEL_ID

# web 客户端（模型选择/会话初始化）引用 llm-deepseek 独占注册的 "deepseek-official"
# 路由 id，绕过 agent-default-model——把该路由本身也指到 HPC 网关（2026-08-28 实测
# 报 "no API key for provider route deepseek-official" 后补）。
# 不要覆写 models：插件默认目录本就是 v4-flash + v4-pro 双模型（名称可区分、
# 上下文窗口默认 1M）——此前覆写成单条 "HPC LLM" 才导致两模型无法区分。
- id: llm-deepseek
  config:
    apiKeyEnv: LLM_API_KEY
    baseURL: !!js process.env.LLM_BASE_URL
    reasoningEffort: high

- insert:
    # 插件以裸包名加载（同 mat-ui 模式）：dsh-web.sh 把 packages/mat-tools
    # 软链进 profile 的 node_modules。entry.name 不得用 !!js——loader 的
    # interpolate 只作用于 config/disabled，name 原样传给 tree.import，且
    # harmony 包扫描先于求值急切读 name（{__jsExpr} 对象直接崩）；
    # package.json main 已指向 src/index.ts（Harmony 原生 ESM loader 加载 TS）。
    - id: mat-tools
      name: 'mat-tools'
    # 显式根入口兼容 Harmony 的原生 ESM loader；同目录 package.json 仍供
    # client-modules 注册表解析 dsh.client 声明。
    - id: mat-ui
      # 使用 bare package 名让 Harmony 同时发现 mat-ui 的 Source Patches；
      # dsh-web.sh 将 profile 的 node_modules/mat-ui 链到本地开发包。
      name: 'mat-ui'
    # OPTIMADE 结构检索（vasp-calc skill 的结构来源之一）：本地
    # ~/dev/optimade_mcp 的 ksai 部署实例，matstream-agent 同款端点。
    # 工具以 mcp__optimade__<name> 注册（query_structures / download_structure /
    # list_providers）；断线指数退避重连（mcp-client 内建）。端点可经
    # env.local 的 OPTIMADE_MCP_URL 覆盖。
    - id: optimade-mcp-reference
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: optimade
        transport: streamable-http
        url: !!js process.env.OPTIMADE_MCP_URL || 'https://c-2076488383597109249.ksai.example.internal:58043/mcp/'
    # matgen 材料筛选/生成（~/aiagent/matgen 的 matgen-mcp 常驻服务，HPC 容器
    # pod matgen-mcp-pod:50046 上的 0.3.x）。pod 的 8080 无直连通路（k8s
    # Service/Pod IP 实测均超时），走 scripts/matgen-tunnel.sh 维护的本地隧道
    # 127.0.0.1:18080——dsh 起服务前先 matgen-tunnel.sh start。工具以
    # mcp__matgen__<name> 注册（material_search_plan / material_search /
    # structure_generate / conditioning_loop / ml_screen / ml_screen_status /
    # server_info / vasp_plan，共 8 个）；toolCallTimeoutMs 放宽到 10 分钟——
    # ml_screen 的 MACE 弛豫常态数分钟，默认 60s 会掐死。断线指数退避重连
    # （mcp-client 内建）与隧道重连循环互补。端点可经 env.local 的
    # MATGEN_MCP_URL 覆写。探针：scripts/probe-matgen.ts。
    - id: matgen-mcp-reference
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: matgen
        transport: streamable-http
        url: !!js process.env.MATGEN_MCP_URL || 'http://127.0.0.1:18080/mcp'
        toolCallTimeoutMs: 600000

# 本仓库 skills/ 目录进模型技能目录（gaussian-calc 等；dsh-skill-filesystem 只扫
# 项目 .dsh/skills、$DSH_HOME/skills 等固定根，本目录不在其默认扫描范围）。
- id: skill-filesystem
  # 基 bundle 默认 disabled: true（2026-09-15 spike 前置核对发现：服务重启后
  # gaussian-calc 报 unknown skill，dump-config 见本行 disabled: true——config
  # patch 不改 disabled 位，必须显式重启）。
  disabled: false
  config:
    # 只从本仓库发现 skill，避免旧 DSH_HOME 或临时目录成为候选根。
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.MAT_DSH_ROOT + '/skills'

# ── batch-subagent spike（plans/2026-09-15-mat-batch-subagent-spike.md）──
# web-app patch 层把 tool-subagent 默认 disabled: true（运行时 registry/providers
# 仍在）；主 agent 的 subagent 工具与三个角色实例（P4）都要显式启用/挂载。
# 角色协议见 skills/batch-roles/SKILL.md；层间契约校验在 mat-core/contracts.ts。
- id: tool-subagent
  disabled: false

# ── shepherd spike（plans/2026-09-15-mat-shepherd-spike.md）──
# send_message/interrupt_agent（可续子 agent 的控制面）同样被 web-app 层默认禁用。
- id: tool-subagent-control
  disabled: false
- insert:
    # 制备工：本地生成输入结构，零集群访问（H8——调不出任何 mat 工具）。
    - id: subagent-prep
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_prep
        backgroundMode: one-shot
        toolFilter:
          allow: ['skill', 'read', 'bash']
        agentOptions:
          provider: mat
          model: deepseek-v4-flash
          maxTokens: 8192
        persona: 批量制备工（batch-roles skill 角色 prep）——只做输入结构制备，先读 skill batch-roles 再干活，按契约回传 JSON。
    # 分诊工：只读远端取证（cat/tail/sacct），禁提交类工具。
    - id: subagent-triage
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_triage
        backgroundMode: one-shot
        toolFilter:
          allow: ['skill', 'read', 'mat_exec']
        agentOptions:
          provider: mat
          model: deepseek-v4-flash
          maxTokens: 8192
        persona: 批量分诊工（batch-roles skill 角色 triage）——读失败证据归类，只读远端禁提交，先读 skill batch-roles，按契约回传 JSON。
    # 分析师：消费结构化结果做科学判定，无任何 mat 工具。
    - id: subagent-analyst
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_analyst
        backgroundMode: one-shot
        toolFilter:
          allow: ['skill', 'read', 'bash', 'job_output']
        agentOptions:
          provider: mat
          model: deepseek-v4-flash
          maxTokens: 8192
        persona: 批量分析师（batch-roles skill 角色 analyst）——判定结果科学可用性，数值逐位来自输入数据，先读 skill batch-roles，按契约回传 JSON。
    # 牧羊人（shepherd spike）：可续后台子 agent，全权一条计算链。全 mat 工具面
    # 但禁一切 agent 生成/控制工具（toolFilter 挡 affordance；maxDepth 1 是运行时
    # 硬顶——牧羊人自身 depth 1 可创建，孙代 depth 2 必拒。注意 maxDepth 0 语义是
    # "本工具完全不能委托"，C' 首跑实测踩坑）。
    - id: subagent-shepherd
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_shepherd
        backgroundMode: continuable
        maxDepth: 1
        toolFilter:
          deny: ['subagent', 'subagent_fork', 'subagent_prep', 'subagent_triage', 'subagent_analyst', 'subagent_shepherd', 'send_message', 'interrupt_agent']
        agentOptions:
          provider: mat
          model: deepseek-v4-flash
          maxTokens: 16384
        persona: 计算链牧羊人（batch-roles skill 角色 shepherd）——全权一条计算链：先读 skill batch-roles 与对应引擎 skill（gaussian-calc 或 vasp-calc），长回合内提交-等待-门检-推进，波内绝不结束回合，用 report 工具中途汇报，预算纪律全程生效。
