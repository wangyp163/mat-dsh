# mat-dsh M0 overlay：骑在 web profile 之上（--patch）
# LLM 路由模式复制自 vasp-matstream-dsh profiles/spike.yml（2026-08-24 已验证）：
#   自定义 baseURL + apiKeyEnv + compat.thinkingFormat: deepseek
# 注意：llm-pi-ai 行是"替换"（同 id 覆盖 dsh-base 默认行），插件行是 insert。
- id: llm-pi-ai
  config:
    providers:
      mat:
        displayName: HPC LLM
        apiKeyEnv: LLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL
        compat:
          thinkingFormat: deepseek
        # 路由级默认推理等级（adapter: options.reasoningEffort ?? profile.reasoning）
        reasoning: high
        # 双模型显式目录：名称可区分；上下文窗口 1M（插件默认仅 262144，须显式声明）
        models:
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            contextWindow: 1000000
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            contextWindow: 1000000

- id: agent-default-model
  config:
    provider: mat
    model: !!js process.env.LLM_MODEL_ID

# web 客户端（模型选择/会话初始化）引用 llm-deepseek 独占注册的 "deepseek-official"
# 路由 id，绕过 agent-default-model——把该路由本身也指到 HPC 网关（2026-08-28 实测
# 报 "no API key for provider route deepseek-official" 后补）。
# 不要覆写 models：插件默认目录本就是 v4-flash + v4-pro 双模型（名称可区分、
# 上下文窗口默认 1M）——此前覆写成单条 "HPC LLM" 才导致两模型无法区分。
- id: llm-deepseek
  config:
    apiKeyEnv: LLM_API_KEY
    baseURL: !!js process.env.LLM_BASE_URL
    reasoningEffort: high

- insert:
    - id: mat-tools
      name: '~/mat-harness/mat-dsh/packages/mat-tools/src/index.ts'

# 本仓库 skills/ 目录进模型技能目录（gaussian-calc 等；dsh-skill-filesystem 只扫
# 项目 .dsh/skills、$DSH_HOME/skills 等固定根，本目录不在其默认扫描范围）。
- id: skill-filesystem
  config:
    customSkillDirs:
      - ~/mat-harness/mat-dsh/skills
