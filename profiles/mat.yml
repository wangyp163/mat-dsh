# mat-dsh M0 overlay：骑在 web profile 之上（--patch）
# LLM 路由模式复制自 vasp-matstream-dsh profiles/spike.yml（2026-08-24 已验证）：
#   自定义 baseURL + apiKeyEnv + compat.thinkingFormat: deepseek
# 注意：llm-pi-ai 行是"替换"（同 id 覆盖 dsh-base 默认行），插件行是 insert。
- id: llm-pi-ai
  config:
    providers:
      mat:
        displayName: HPC LLM
        apiKeyEnv: LLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL
        compat:
          thinkingFormat: deepseek
        # 路由级默认推理等级（adapter: options.reasoningEffort ?? profile.reasoning）
        reasoning: high
        # 双模型显式目录：名称可区分；上下文窗口 1M（插件默认仅 262144，须显式声明）。
        # reasoningEfforts 必须逐模型声明：本路由是 hand-declared（不在 pi-ai 内置目录），
        # 缺省时模型无 reasoning 能力 → resolveModelInfo 不含 reasoning 元数据，
        # /model 弹窗就没有推理等级可选（2026-08-28 用户实测反馈）。
        # 等级集对齐 deepseek 家族（llm-deepseek 插件枚举 off/low/high/max）；off 为空值=不发送。
        models:
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            contextWindow: 1000000
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            contextWindow: 1000000
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
      # BigModel GLM（glm-5.3-flash）：解决 HPC 网关 deepseek 双模型无图像输入
      # 的问题（2026-09-04 实测两模型对 image_url 均静默丢图）。密钥放 env.local
      # 的 BIGMODEL_API_KEY。思考等级依据官方文档（capabilities/thinking）：
      # GLM-5.3 系不可关闭思考（thinking.type:disabled 直接报错），深度用
      # reasoning_effort low/high/max 调节；zai 格式在"无等级"时发 disabled → 400，
      # 故不声明 off 档，并以路由级 reasoning: high 兜底保证请求必带等级；
      # open.bigmodel.cn 的 zai 检测默认 supportsReasoningEffort=false，必须显式
      # 打开才会发送 reasoning_effort（否则 thinking 只能开/关、深度恒为默认 max）。
      # glm-5.3-flash 是 GLM-5 系首个原生多模态（图片/视频/文件），input 声明
      # image 后 read_image 工具的路由闸即对其放行。
      bigmodel:
        displayName: BigModel GLM
        apiKeyEnv: BIGMODEL_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        compat:
          thinkingFormat: zai
          supportsReasoningEffort: true
        reasoning: high
        models:
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max

- id: agent-default-model
  config:
    # 路由随环境切换（mat=deepseek 双模型 | bigmodel=glm-5.3-flash 多模态），
    # 与 LLM_MODEL_ID 配套；用户级 settings.yaml 的 agent-default-model 同旨。
    provider: !!js process.env.LLM_PROVIDER_ID || 'mat'
    model: !!js process.env.LLM_MODEL_ID

# web 客户端（模型选择/会话初始化）引用 llm-deepseek 独占注册的 "deepseek-official"
# 路由 id，绕过 agent-default-model——把该路由本身也指到 HPC 网关（2026-08-28 实测
# 报 "no API key for provider route deepseek-official" 后补）。
# 不要覆写 models：插件默认目录本就是 v4-flash + v4-pro 双模型（名称可区分、
# 上下文窗口默认 1M）——此前覆写成单条 "HPC LLM" 才导致两模型无法区分。
- id: llm-deepseek
  config:
    apiKeyEnv: LLM_API_KEY
    baseURL: !!js process.env.LLM_BASE_URL
    reasoningEffort: high

- insert:
    # 插件以裸包名加载（同 mat-ui 模式）：dsh-web.sh 把 packages/mat-tools
    # 软链进 profile 的 node_modules。entry.name 不得用 !!js——loader 的
    # interpolate 只作用于 config/disabled，name 原样传给 tree.import，且
    # harmony 包扫描先于求值急切读 name（{__jsExpr} 对象直接崩）；
    # package.json main 已指向 src/index.ts（Harmony 原生 ESM loader 加载 TS）。
    - id: mat-tools
      name: 'mat-tools'
    # 显式根入口兼容 Harmony 的原生 ESM loader；同目录 package.json 仍供
    # client-modules 注册表解析 dsh.client 声明。
    - id: mat-ui
      # 使用 bare package 名让 Harmony 同时发现 mat-ui 的 Source Patches；
      # dsh-web.sh 将 profile 的 node_modules/mat-ui 链到本地开发包。
      name: 'mat-ui'

# 本仓库 skills/ 目录进模型技能目录（gaussian-calc 等；dsh-skill-filesystem 只扫
# 项目 .dsh/skills、$DSH_HOME/skills 等固定根，本目录不在其默认扫描范围）。
- id: skill-filesystem
  config:
    # 只从本仓库发现 skill，避免旧 DSH_HOME 或临时目录成为候选根。
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.MAT_DSH_ROOT + '/skills'
