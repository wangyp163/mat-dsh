<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"
     font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#97a3b5"/>
    </marker>
  </defs>

  <rect width="1440" height="1000" fill="#eef1f5"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2430">mat-dsh · 拓扑结构（简化版）</text>
  <text x="40" y="68" font-size="12" fill="#5a6373">只看节点与连接 · 模块细节见完整版 architecture-diagram.html / .png</text>

  <!-- ══ 连接线（先画线，节点盖在上面） ══ -->
  <g stroke="#97a3b5" stroke-width="1.7" fill="none">
    <!-- 浏览器 ⇄ 宿主 -->
    <line x1="720" y1="142" x2="720" y2="188" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <!-- 宿主 ⇄ LLM -->
    <line x1="503" y1="229" x2="362" y2="229" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <!-- 宿主 → 子agent -->
    <line x1="935" y1="229" x2="1128" y2="229" marker-end="url(#arr)"/>
    <!-- 宿主 → skills（肘形） -->
    <path d="M 545 268 V 299 H 210 V 328" marker-end="url(#arr)"/>
    <!-- 宿主 → tools / ui 插件 -->
    <line x1="600" y1="268" x2="600" y2="328" marker-end="url(#arr)"/>
    <line x1="920" y1="268" x2="920" y2="328" marker-end="url(#arr)"/>
    <!-- tools → ui（状态板/文件服务） -->
    <line x1="710" y1="359" x2="848" y2="359" marker-end="url(#arr)"/>
    <!-- 插件 → core -->
    <line x1="575" y1="388" x2="575" y2="456" marker-end="url(#arr)"/>
    <line x1="965" y1="388" x2="965" y2="456" marker-end="url(#arr)"/>
    <!-- core → MCP 网关 / OpenAPI -->
    <line x1="560" y1="542" x2="560" y2="596" marker-end="url(#arr)"/>
    <line x1="940" y1="542" x2="940" y2="596" marker-end="url(#arr)"/>
    <!-- MCP / efile → Slurm（肘形） -->
    <path d="M 560 660 V 698 H 630 V 734" marker-end="url(#arr)"/>
    <path d="M 940 660 V 698 H 810 V 734" marker-end="url(#arr)"/>
    <!-- Slurm → workflow -->
    <line x1="720" y1="798" x2="720" y2="854" marker-end="url(#arr)"/>
  </g>

  <!-- 连接标签（白色描边光晕） -->
  <g font-size="11" fill="#4a5568" stroke="#eef1f5" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="732" y="170">HTTP :3080 · 会话 / 状态快照</text>
    <text x="432" y="221" text-anchor="middle">OpenAI API</text>
    <text x="1032" y="221" text-anchor="middle">spawn · 角色契约</text>
    <text x="377" y="292" text-anchor="middle">skill 注入</text>
    <text x="760" y="292" text-anchor="middle">cordis 挂载 · profiles overlay --patch</text>
    <text x="780" y="351" text-anchor="middle">状态板 · 文件服务</text>
    <text x="770" y="430" text-anchor="middle">workspace import</text>
    <text x="540" y="575" text-anchor="end">remote-shell · exec-gate/guard 过闸</text>
    <text x="960" y="575">AK/SK → token · 上传/下载</text>
    <text x="598" y="690" text-anchor="middle">命令执行</text>
    <text x="872" y="690" text-anchor="middle">文件落集群存储</text>
    <text x="734" y="832">运行 pre / run / post</text>
  </g>

  <!-- ══ 节点 ══ -->
  <!-- A 浏览器 -->
  <g>
    <rect x="610" y="92" width="220" height="50" rx="10" fill="#f4f6f9" stroke="#8f9aab" stroke-width="1.5"/>
    <text x="720" y="112" font-size="14" font-weight="700" fill="#3d4a5c" text-anchor="middle">浏览器 · Web UI</text>
    <text x="720" y="130" font-size="10.5" fill="#6b7484" text-anchor="middle">:3080 · 会话 / 状态卡片</text>
  </g>

  <!-- C LLM 路由 -->
  <g>
    <rect x="60" y="187" width="300" height="84" rx="10" fill="#f5f7fa" stroke="#7d8798" stroke-width="1.5"/>
    <text x="210" y="212" font-size="14" font-weight="700" fill="#3d4a5c" text-anchor="middle">LLM 路由</text>
    <text x="210" y="232" font-size="10.5" fill="#6b7484" text-anchor="middle">DeepSeek-V4-Pro / Flash（1M ctx）</text>
    <text x="210" y="248" font-size="10.5" fill="#6b7484" text-anchor="middle">BigModel · GLM-5.3-Flash（多模态）</text>
  </g>

  <!-- B 宿主 -->
  <g>
    <rect x="505" y="190" width="430" height="78" rx="10" fill="#f4f1fc" stroke="#5b4bb7" stroke-width="1.8"/>
    <text x="720" y="218" font-size="15" font-weight="700" fill="#5b4bb7" text-anchor="middle">dsh web 宿主 · DeepSeek Harness</text>
    <text x="720" y="240" font-size="10.5" fill="#6b7484" text-anchor="middle">cordis · dsh-tools · dsh-jobs（后台作业 + 完成通知）</text>
    <text x="720" y="256" font-size="10.5" fill="#6b7484" text-anchor="middle">树外组合：--patch overlay，不改宿主源码</text>
  </g>

  <!-- D 子 agent -->
  <g>
    <rect x="1130" y="187" width="300" height="84" rx="10" fill="#f7f5fd" stroke="#8f84d8" stroke-width="1.5"/>
    <text x="1280" y="212" font-size="14" font-weight="700" fill="#5b4bb7" text-anchor="middle">子 agent ×4 · tool-subagent</text>
    <text x="1280" y="232" font-size="10.5" fill="#6b7484" text-anchor="middle">prep · triage · analyst · shepherd</text>
    <text x="1280" y="248" font-size="10.5" fill="#6b7484" text-anchor="middle">牧羊人可续后台 · maxDepth 1</text>
  </g>

  <!-- E skills -->
  <g>
    <rect x="60" y="330" width="300" height="58" rx="10" fill="#eef4fc" stroke="#5a83c4" stroke-width="1.5"/>
    <text x="210" y="353" font-size="14" font-weight="700" fill="#1a4f8f" text-anchor="middle">skills ×7</text>
    <text x="210" y="372" font-size="10.5" fill="#6b7484" text-anchor="middle">gaussian-calc · abacus-calc · batch-* …</text>
  </g>

  <!-- F tools 插件 -->
  <g>
    <rect x="440" y="330" width="270" height="58" rx="10" fill="#e9f1fd" stroke="#1d5dc0" stroke-width="1.8"/>
    <text x="575" y="353" font-size="14" font-weight="700" fill="#1d5dc0" text-anchor="middle">tools 插件</text>
    <text x="575" y="372" font-size="10.5" fill="#6b7484" text-anchor="middle">11 个工具（exec · gaussian · watch …）</text>
  </g>

  <!-- G ui 插件 -->
  <g>
    <rect x="850" y="330" width="230" height="58" rx="10" fill="#e9f1fd" stroke="#1d5dc0" stroke-width="1.5"/>
    <text x="965" y="353" font-size="14" font-weight="700" fill="#1d5dc0" text-anchor="middle">ui 插件</text>
    <text x="965" y="372" font-size="10.5" fill="#6b7484" text-anchor="middle">状态卡片 · 文件浏览 · 2 Patch</text>
  </g>

  <!-- H core 核心库 -->
  <g>
    <rect x="490" y="458" width="460" height="84" rx="10" fill="#e8f5f1" stroke="#0d7a5f" stroke-width="1.8"/>
    <text x="720" y="483" font-size="15" font-weight="700" fill="#0d7a5f" text-anchor="middle">core（核心库）</text>
    <text x="720" y="503" font-size="10.5" fill="#525c6b" text-anchor="middle">传输 · exec-gate / exec-guard · watch-loop · slurm</text>
    <text x="720" y="519" font-size="10.5" fill="#525c6b" text-anchor="middle">gaussian · efile · file-sync · portfolio · db</text>
  </g>

  <!-- I MCP 网关 -->
  <g>
    <rect x="390" y="598" width="340" height="62" rx="10" fill="#fdf0e5" stroke="#b35c0a" stroke-width="1.8"/>
    <text x="560" y="622" font-size="14" font-weight="700" fill="#b35c0a" text-anchor="middle">MCP 网关</text>
    <text x="560" y="641" font-size="10.5" fill="#6b7484" text-anchor="middle">remote-shell ·（密钥, 集群）复用 shell</text>
  </g>

  <!-- J OpenAPI / efile -->
  <g>
    <rect x="790" y="598" width="300" height="62" rx="10" fill="#fdf0e5" stroke="#b35c0a" stroke-width="1.5"/>
    <text x="940" y="622" font-size="14" font-weight="700" fill="#b35c0a" text-anchor="middle">OpenAPI · efile</text>
    <text x="940" y="641" font-size="10.5" fill="#6b7484" text-anchor="middle">AK/SK → token → 上传 / 下载</text>
  </g>

  <!-- K Slurm -->
  <g>
    <rect x="530" y="736" width="380" height="62" rx="10" fill="#fde9d8" stroke="#a34e08" stroke-width="1.8"/>
    <text x="720" y="760" font-size="14" font-weight="700" fill="#a34e08" text-anchor="middle">Slurm 集群运行时</text>
    <text x="720" y="779" font-size="10.5" fill="#6b7484" text-anchor="middle">sbatch · sacct · scancel · 集群存储</text>
  </g>

  <!-- L workflow 商品 -->
  <g>
    <rect x="505" y="856" width="430" height="62" rx="10" fill="#fde9d8" stroke="#a34e08" stroke-width="1.5"/>
    <text x="720" y="880" font-size="14" font-weight="700" fill="#a34e08" text-anchor="middle">Gaussian / ABACUS workflow 商品</text>
    <text x="720" y="899" font-size="10.5" fill="#6b7484" text-anchor="middle">pre / run / post 三段式 · 科学软件与许可证</text>
  </g>

  <!-- 图例 -->
  <g font-size="11" fill="#5a6373">
    <text x="40" y="966">→  依赖 / 调用        ⇄  双向交互</text>
    <text x="300" y="966" fill="#5b4bb7">■ 宿主</text>
    <text x="360" y="966" fill="#1d5dc0">■ 本仓插件 / skills</text>
    <text x="520" y="966" fill="#0d7a5f">■ core 核心库</text>
    <text x="620" y="966" fill="#b35c0a">■ 远端计算平面</text>
  </g>
</svg>
