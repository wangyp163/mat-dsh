name: ci

# CI 单一定义：typecheck + 全量测试。可执行步骤收敛在 scripts/ci.sh，
# 本地、pre-push hook、GitHub Actions 走同一条路径，避免两套步骤漂移。
#
# 依赖前置：本仓是树外组合（host: deepseek-harness），pnpm overrides 以
# link:../deepseek-harness/* 引用宿主源码，故安装前先浅克隆宿主到 sibling 目录。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mat-core 用 node:sqlite（Node ≥22.13 内置）。低版本会让 db 相关测试
      # 直接 import 失败，故版本下限在此硬性声明。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: clone host (out-of-tree composition, pinned to verified tag)
        run: git clone --depth 1 --branch dsh-v0.1.0-rc.8 https://github.com/deepseek-ai/deepseek-harness.git ../deepseek-harness

      # 宿主必须 install + build：link: overrides 的类型解析走宿主包 exports 指向的
      # lib/*.d.ts 构建产物，未构建的宿主会让泛型推断链断掉（树外组合的隐性契约）。
      - name: install and build host
        run: |
          pnpm --dir ../deepseek-harness install --no-frozen-lockfile
          pnpm --dir ../deepseek-harness build

      - name: install
        run: pnpm install --no-frozen-lockfile

      # 单点定义：与本地/其他 CI 完全同一条路径，避免两套步骤漂移
      - name: ci
        run: bash scripts/ci.sh

      # 失败现场直出 annotations（::error 可被 API 免认证读取），便于定位环境性解析问题
      - name: diagnostics (on failure)
        if: failure()
        run: |
          echo "::error::node=$(node -v) pnpm=$(pnpm -v) | tools=[$(ls packages/mat-tools/node_modules/@deepseek-ai 2>/dev/null | tr '\n' ',')] | root=[$(ls node_modules/@deepseek-ai 2>/dev/null | tr '\n' ',')]"
